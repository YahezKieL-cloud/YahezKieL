    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: #050608;
        }

        /* BACKGROUND */

        .background {
            position: fixed;
            inset: 0;

            background-image: url("photo.jpg");
            background-size: cover;
            background-position: center;

            filter: brightness(35%) blur(2px);

            transform: scale(1.05);

            z-index: -2;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.25),
                rgba(0,0,0,0.90)
            );

            z-index: -1;
        }

        /* CONTAINER */

        .container {
            width: 100%;
            max-width: 500px;

            margin: auto;

            padding: 55px 25px 45px;

            text-align: center;
        }

        /* DEKORASI */

        .note-left {
            position: absolute;

            top: 40px;
            left: 25px;

            font-size: 17px;
            font-style: italic;

            color: #c4ccdc;

            opacity: 0.8;

            line-height: 1.1;
        }

        .note-right {
            position: absolute;

            top: 45px;
            right: 25px;

            font-size: 10px;

            letter-spacing: 4px;

            color: #c4ccdc;

            line-height: 1.8;

            text-align: center;
        }

        /* FOTO PROFIL */

        .profile {
            width: 135px;
            height: 135px;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid white;

            box-shadow:
                0 0 15px rgba(255,255,255,0.8),
                0 0 35px rgba(170,190,255,0.5);

            margin-top: 55px;
        }

        /* NAMA */

        h1 {
            margin: 18px 0 5px;

            font-size: 34px;

            font-weight: 800;
        }

        .username {
            color: #aeb6c8;

            font-size: 17px;
        }

        /* BIO */

        .bio {
            margin: 25px 0;

            font-size: 16px;

            color: #e0e3ea;

            line-height: 1.6;
        }

        /* GARIS */

        .line {
            width: 100px;

            height: 2px;

            margin: 0 auto 25px;

            background: white;

            box-shadow: 0 0 10px white;
        }

        /* LINK */

        .links {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .link {
            display: flex;

            align-items: center;

            width: 100%;

            padding: 15px 18px;

            border-radius: 20px;

            text-decoration: none;

            color: white;

            background: rgba(5,8,14,0.75);

            border: 1px solid rgba(210,225,255,0.45);

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 15px rgba(150,180,255,0.12);

            transition: 0.25s;
        }

        .link:hover {
            transform: translateY(-3px);

            border-color: white;

            box-shadow:
                0 0 25px rgba(180,200,255,0.3);
        }

        /* ICON */

        .icon {
            width: 45px;
            height: 45px;

            border-radius: 13px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: rgba(255,255,255,0.08);

            font-size: 22px;

            margin-right: 15px;
        }

        /* TEKS LINK */

        .link-text {
            text-align: left;
        }

        .link-title {
            font-size: 16px;

            font-weight: bold;
        }

        .link-subtitle {
            margin-top: 4px;

            font-size: 12px;

            color: #aeb6c8;
        }

        /* PANAH */

        .arrow {
            margin-left: auto;

            font-size: 28px;

            color: #dce5f7;
        }

        /* FOOTER */

        .footer {
            margin-top: 40px;

            color: #8b94a5;

            font-size: 11px;

            letter-spacing: 5px;
        }

        .social {
            margin-top: 15px;

            font-size: 18px;

            letter-spacing: 12px;

            color: #cbd3e2;
        }

        /* HP */

        @media (max-width: 380px) {

            .container {
                padding-left: 18px;
                padding-right: 18px;
            }

            .profile {
                width: 115px;
                height: 115px;
            }

            h1 {
                font-size: 29px;
            }

        }

    </style>
</head>
