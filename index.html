<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YahezKieL</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#26304a,#0b0d14 50%,#050609);color:white;display:flex;justify-content:center}
.container{width:min(100%,480px);padding:55px 22px 35px;text-align:center}
.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid white;
    box-shadow:0 0 25px #ffffff66;}
h1{margin:18px 0 6px;font-size:27px;letter-spacing:.5px}.handle{color:#aeb6c8;margin-bottom:28px}
.bio{font-size:14px;color:#d6d9e2;margin:-10px 0 25px}.links{display:grid;gap:14px}
a{display:block;padding:17px 20px;border-radius:15px;background:#ffffff0d;border:1px solid #ffffff1c;color:#fff;text-decoration:none;font-weight:700;backdrop-filter:blur(10px);transition:.2s}
a:hover{transform:translateY(-2px);background:#ffffff18}.small{font-weight:500;color:#c4cad7;font-size:13px}
footer{margin-top:32px;color:#737b8c;font-size:12px}
</style>
</head>
<body>
<main class="container">
<img class="avatar" src="profile.png" alt="YahezKieL">
<h1>YahezKieL</h1>
<div class="handle">@YahezKieL</div>
<p class="bio">Welcome to my space.</p>
<div class="links">
<a href="https://instagram.com/" target="_blank">Instagram</a>
<a href="https://tiktok.com/" target="_blank">TikTok</a>
<a href="https://t.me/" target="_blank">Telegram</a>
<a href="https://wa.me/" target="_blank">WhatsApp</a>
<a href="#" class="small">Link lainnya</a>
</div>
<footer>© 2026 YahezKieL</footer>
</main>
</body>
</html>
